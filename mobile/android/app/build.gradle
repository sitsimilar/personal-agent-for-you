apply plugin: 'com.android.application'

/**
 * 版本号**从仓库根的 package.json 读**，不在 gradle 里另开一处。
 * 发版流程只维护 root/web/desktop 三处 `version`，这里跟着走即可：
 * - versionName = 原样字符串（2.13.4）
 * - versionCode = major*10000 + minor*100 + patch（2.13.4 → 21304），
 *   Android 要求单调递增，这个映射在 99 以内的小版本/补丁号下都成立。
 */
def rootPackageJson = new groovy.json.JsonSlurper().parseText(
        file('../../../package.json').getText('UTF-8'))
def appVersionName = rootPackageJson.version.toString()
def (vMajor, vMinor, vPatch) = appVersionName.tokenize('.').collect { it.replaceAll(/[^0-9].*/, '') as int }
def appVersionCode = vMajor * 10000 + vMinor * 100 + vPatch

/**
 * 签名配置**按文件存在与否决定**，而不是写死。
 *
 * - 仓库里没有 keystore（开源用户克隆下来就是这种情况）→ `assembleRelease`
 *   产出的是 unsigned APK，**装不上**；`build-apk.mjs` 会检测到并回落 debug 包；
 * - 本机 `android/keystore.properties` 存在 → 用自签密钥签 release 包，
 *   可以直接装、也能覆盖升级（前提是同一个 keystore）。
 *
 * keystore.properties 与 *.jks 都在 `mobile/.gitignore` 里：签名私钥泄露 = 别人能发
 * 一个「同名同包名」的假包覆盖安装。
 */
def keystorePropsFile = rootProject.file('keystore.properties')
def hasReleaseSigning = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasReleaseSigning) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace "com.personalagent.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.personalagent.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // 签名配置必须**先于** buildTypes 声明：buildTypes 里查 signingConfigs.release
    // 时容器还没这一项，Gradle 会直接报 "Could not find method release()"
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                // 三种签名方案显式全开：
                // - v1(JAR)  → Android 6.x 及更老（minSdk 23 必须要）
                // - v2        → Android 7.0~8.x
                // - v3        → Android 9+（含密钥轮换）
                // AGP 在 minSdk < 28 时默认只写 v1+v2，实测部分国内 ROM 的安装校验
                // 对缺 v3 的包更挑剔；显式打开的代价只是多一个签名块。
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                // v4 不开：只对 `adb install --incremental` 有用，且会额外产出
                // .idsig 旁文件，用户容易误以为要一起装。
                enableV4Signing false
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                // 有密钥才签；没有就产出 unsigned（build-apk.mjs 会回落 debug）
                signingConfig signingConfigs.release
            }
        }
        debug {
            /**
             * debug 包也用手上这把 release 密钥签，**不再用 ~/.android/debug.keystore**。
             *
             * 原因（11-16 实机反馈「安装包无法安装」的直接来源）：
             * debug 与 release 是同一个 applicationId，但默认分别由
             * `C=US, O=Android, CN=Android Debug` 和自签证书签名。Android 安装器把
             * 「同包名 + 不同证书」判为 `INSTALL_FAILED_UPDATE_INCOMPATIBLE`，表现就是
             * 「应用未安装」——先装了 debug 包的人，再装 release 包 100% 失败，反之亦然。
             * 统一成同一把密钥后，两个包可以互相覆盖升级，这个坑从此不存在。
             */
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
